name: build

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  build-macos:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: universal-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Tag release commit
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require(`${process.env.GITHUB_WORKSPACE}/package.json`);
            const tag = `v${version}`;
            const pr = context.payload.pull_request;
            if (pr.head.ref !== `release/${tag}`) {
              throw new Error(`Release branch must be release/${tag}`);
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            try {
              const { data } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              if (data.object.sha !== pr.merge_commit_sha) {
                throw new Error(`${tag} already points to a different commit`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                ...repo,
                ref: `refs/tags/${tag}`,
                sha: pr.merge_commit_sha,
              });
            }

      - uses: tauri-apps/tauri-action@v0
        env:
          # https://github.com/tauri-apps/tauri-action/issues/740
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          releaseCommitish: ${{ github.event.pull_request.merge_commit_sha }}
          args: --target ${{ matrix.target }}
