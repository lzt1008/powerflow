[workspace]
members = [
  "src-tauri",
  "crates/*"
]
resolver = "2"

[workspace.dependencies]
tpower = { path = "crates/tpower" }

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

# macOS 27 rejects strip-misaligned proc-macro dylibs (LINKEDIT string pool).
[profile.release.package.sqlx-macros]
strip = "none"
